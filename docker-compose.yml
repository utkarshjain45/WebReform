services:
  # ============================================================================
  # 1. PostgreSQL Relational Database (Port 5432)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: webreform-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webreform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Python WebReform Optimizer Engine (Port 8000)
  # ============================================================================
  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: webreform-optimizer
    restart: unless-stopped
    ports:
      - "${OPTIMIZER_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=${OPTIMIZER_PORT:-8000}
      - WORKERS=${OPTIMIZER_WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    networks:
      - webreform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3. Spring Boot Application Backend (Port 8080)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webreform-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - PORT=${BACKEND_PORT:-8080}
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB}}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - OPTIMIZER_SERVICE_URL=${OPTIMIZER_SERVICE_URL:-http://optimizer:8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CRAWLER_USER_AGENT=${CRAWLER_USER_AGENT}
      - CRAWLER_CONNECT_TIMEOUT_MS=${CRAWLER_CONNECT_TIMEOUT_MS:-6000}
      - CRAWLER_READ_TIMEOUT_MS=${CRAWLER_READ_TIMEOUT_MS:-8000}
      - CRAWLER_DEFAULT_MAX_PAGES=${CRAWLER_DEFAULT_MAX_PAGES:-30}
      - CRAWLER_DEFAULT_MAX_DEPTH=${CRAWLER_DEFAULT_MAX_DEPTH:-3}
      - CRAWLER_MAX_ALLOWED_PAGES=${CRAWLER_MAX_ALLOWED_PAGES:-200}
      - CRAWLER_MAX_ALLOWED_DEPTH=${CRAWLER_MAX_ALLOWED_DEPTH:-8}
    networks:
      - webreform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 4. React Single Page Application (Port 3000)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ACCESS_CODE: ${VITE_ACCESS_CODE}
    container_name: webreform-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
      - PORT=${FRONTEND_PORT:-3000}
      - HOST=0.0.0.0
      - VITE_ACCESS_CODE=${VITE_ACCESS_CODE}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - webreform-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  webreform-network:
    driver: bridge

volumes:
  postgres_data:
