server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: webreform-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/webreform_db}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

optimizer:
  service:
    url: ${OPTIMIZER_SERVICE_URL:http://localhost:8000}

crawler:
  user-agent: "${CRAWLER_USER_AGENT:WebReform-Crawler/1.0 (+https://webreform.io)}"
  connect-timeout-ms: ${CRAWLER_CONNECT_TIMEOUT_MS:6000}
  read-timeout-ms: ${CRAWLER_READ_TIMEOUT_MS:8000}
  max-body-size-bytes: ${CRAWLER_MAX_BODY_SIZE_BYTES:2097152} # 2MB
  default-max-pages: ${CRAWLER_DEFAULT_MAX_PAGES:30}
  default-max-depth: ${CRAWLER_DEFAULT_MAX_DEPTH:3}
  max-allowed-pages: ${CRAWLER_MAX_ALLOWED_PAGES:200}
  max-allowed-depth: ${CRAWLER_MAX_ALLOWED_DEPTH:8}
